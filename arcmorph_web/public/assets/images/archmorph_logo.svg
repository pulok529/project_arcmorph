<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Rect -->
  <rect width="500" height="500" rx="40" fill="#0b0f19" />

  <!-- Isometric Cube Structure (Legacy Frame) -->
  <g transform="translate(60, 50)">
    <!-- Top Face -->
    <path d="M 190 60 L 310 120 L 190 180 L 70 120 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Left Face (Solid Architectural Pillar) -->
    <path d="M 70 120 L 190 180 L 190 320 L 70 260 Z" fill="#151d30" stroke="url(#primaryGrad)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Architectural Cutout in Left Pillar -->
    <path d="M 95 150 L 165 185 L 165 285 L 95 250 Z" fill="#0b0f19" stroke="#3b82f6" stroke-width="4" />
    
    <!-- Right Face (Morphing Neural Nodes) -->
    <!-- Connection Lines -->
    <g stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)">
      <line x1="190" y1="180" x2="260" y2="170" />
      <line x1="260" y1="170" x2="310" y2="120" />
      <line x1="260" y1="170" x2="250" y2="240" />
      <line x1="190" y1="240" x2="250" y2="240" />
      <line x1="250" y1="240" x2="310" y2="210" />
      <line x1="310" y1="120" x2="310" y2="210" />
      <line x1="250" y1="240" x2="220" y2="300" />
      <line x1="190" y1="320" x2="220" y2="300" />
      <line x1="220" y1="300" x2="290" y2="280" />
      <line x1="310" y1="210" x2="290" y2="280" />
    </g>

    <!-- Glowing Nodes -->
    <circle cx="260" cy="170" r="10" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="250" cy="240" r="12" fill="#10b981" filter="url(#glow)" />
    <circle cx="310" cy="120" r="8" fill="#00f2fe" />
    <circle cx="310" cy="210" r="9" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="220" cy="300" r="10" fill="#3b82f6" filter="url(#glow)" />
    <circle cx="290" cy="280" r="11" fill="#10b981" filter="url(#glow)" />
  </g>

  <!-- Typography -->
  <text x="250" y="415" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="2">
    ArchMorph
  </text>
  <text x="250" y="448" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="4">
    SOFTWARE MODERNIZATION PLATFORM
  </text>
</svg>
