<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="60%" stop-color="#050b14"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="256" fill="url(#bgGlow)"/>

  <!-- Cybernetic Hexagonal Ring Halo -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="rgba(0, 242, 254, 0.15)" stroke-width="2" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="rgba(59, 130, 246, 0.25)" stroke-width="1.5"/>

  <!-- Futuristic Shoulders / Tech Armor Collar -->
  <path d="M120 460 C 140 370, 200 350, 256 350 C 312 350, 372 370, 392 460 L 392 512 L 120 512 Z" fill="url(#suitGrad)"/>
  <!-- Tech Collar Lapels -->
  <path d="M190 360 L 256 430 L 236 512 L 170 512 Z" fill="#0f172a" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5"/>
  <path d="M322 360 L 256 430 L 276 512 L 342 512 Z" fill="#0f172a" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5"/>
  <!-- Glowing Center Power Core Line -->
  <line x1="256" y1="430" x2="256" y2="512" stroke="#00f2fe" stroke-width="3" filter="url(#glowFilter)"/>

  <!-- Neck -->
  <path d="M226 310 L 226 365 C 236 375, 276 375, 286 365 L 286 310 Z" fill="#475569"/>

  <!-- Head / Jaw Silhouette -->
  <path d="M180 180 C 180 110, 332 110, 332 180 C 332 245, 305 315, 256 325 C 207 315, 180 245, 180 180 Z" fill="#1e293b"/>
  <!-- Inner Face Tone -->
  <path d="M192 185 C 192 125, 320 125, 320 185 C 320 238, 298 300, 256 310 C 214 300, 192 238, 192 185 Z" fill="url(#faceGrad)"/>

  <!-- Futuristic Cyber Hair / Tech Cowl -->
  <path d="M172 175 C 168 110, 220 70, 256 68 C 292 70, 344 110, 340 175 C 326 150, 310 135, 256 135 C 202 135, 186 150, 172 175 Z" fill="#0b0f19" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5"/>

  <!-- Cybernetic Neural Ear Piece -->
  <rect x="168" y="195" width="12" height="30" rx="6" fill="#00f2fe" filter="url(#glowFilter)"/>
  <rect x="332" y="195" width="12" height="30" rx="6" fill="#00f2fe" filter="url(#glowFilter)"/>

  <!-- Cyber Visor / High-Tech Neon Glasses -->
  <path d="M188 178 C 220 174, 292 174, 324 178 C 330 205, 318 222, 256 222 C 194 222, 182 205, 188 178 Z" fill="url(#neonGlow)" stroke="#00f2fe" stroke-width="2.5" filter="url(#glowFilter)"/>
  <!-- Visor Digital HUD Lines -->
  <line x1="205" y1="198" x2="245" y2="198" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  <circle cx="256" cy="198" r="3" fill="#ffffff"/>
  <line x1="267" y1="198" x2="307" y2="198" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  <circle cx="215" cy="208" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="297" cy="208" r="1.5" fill="#ffffff" opacity="0.7"/>

  <!-- Nose & Mouth Clean Accents -->
  <path d="M253 242 L 256 250 L 259 242" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="240" y1="272" x2="272" y2="272" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Holographic Neural Circuit Trace on Right Cheek -->
  <path d="M305 230 L 320 245 L 320 265 L 310 275" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.8" filter="url(#glowFilter)"/>
  <circle cx="310" cy="275" r="2.5" fill="#00f2fe"/>
  <circle cx="305" cy="230" r="2" fill="#00f2fe"/>

  <!-- ArcMorph Hex Badge Watermark at Bottom Right -->
  <polygon points="410,410 440,395 470,410 470,440 440,455 410,440" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="1.5"/>
  <text x="440" y="430" fill="#00f2fe" font-size="14" font-family="monospace" font-weight="bold" text-anchor="middle">AM</text>
</svg>