  <text x="57" y="42" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#64748b" letter-spacing="2.8">STUDIO PLATFORM</text>
