<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="100%" height="100%">
  <defs>
    <linearGradient id="amGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="amAccent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="amTextGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Morphing Architectural Cube (Left Icon, 40x40 area) -->
  <g transform="translate(6, 5) scale(0.11)">
    <!-- Top Face -->
    <path d="M 190 60 L 310 120 L 190 180 L 70 120 Z" fill="rgba(0, 242, 254, 0.15)" stroke="url(#amGrad1)" stroke-width="12" stroke-linejoin="round" />
    <!-- Left Face -->
    <path d="M 70 120 L 190 180 L 190 320 L 70 260 Z" fill="rgba(15, 23, 42, 0.85)" stroke="url(#amGrad1)" stroke-width="12" stroke-linejoin="round" />
    <!-- Architecture Cutout -->
    <path d="M 95 150 L 165 185 L 165 285 L 95 250 Z" fill="#0b0f19" stroke="#38bdf8" stroke-width="6" />
    <!-- Neural Lines -->
    <g stroke="url(#amAccent1)" stroke-width="7" filter="url(#glow1)">
      <line x1="190" y1="180" x2="260" y2="170" /><line x1="260" y1="170" x2="310" y2="120" />
      <line x1="260" y1="170" x2="250" y2="240" /><line x1="190" y1="240" x2="250" y2="240" />
      <line x1="250" y1="240" x2="310" y2="210" /><line x1="310" y1="120" x2="310" y2="210" />
      <line x1="250" y1="240" x2="220" y2="300" /><line x1="190" y1="320" x2="220" y2="300" />
      <line x1="220" y1="300" x2="290" y2="280" /><line x1="310" y1="210" x2="290" y2="280" />
    </g>
    <circle cx="260" cy="170" r="14" fill="#00f2fe" filter="url(#glow1)" />
    <circle cx="250" cy="240" r="16" fill="#10b981" filter="url(#glow1)" />
    <circle cx="310" cy="120" r="12" fill="#00f2fe" />
    <circle cx="310" cy="210" r="14" fill="#00f2fe" filter="url(#glow1)" />
    <circle cx="220" cy="300" r="15" fill="#38bdf8" filter="url(#glow1)" />
    <circle cx="290" cy="280" r="16" fill="#10b981" filter="url(#glow1)" />
  </g>

  <!-- Typography (Horizontal Layout) -->
  <text x="56" y="29" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="23" font-weight="800" fill="url(#amTextGradLight)" letter-spacing="1">Arch<tspan fill="#00f2fe">Morph</tspan></text>
  <text x="57" y="42" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#38bdf8" letter-spacing="2.8">STUDIO PLATFORM</text>
</svg>